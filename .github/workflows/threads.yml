name: Threads パース投稿
on:
  schedule:
    - cron: '30 22 * * *'   # 日本時間 7:30
    - cron: '30 13 * * *'   # 日本時間 22:30
    - cron: '30 3 * * *'    # 日本時間 12:30（noteの告知など）
    - cron: '0 9 * * *'     # 日本時間 18:00（リール動画）
    - cron: '30 11 * * *'   # 日本時間 20:30
    - cron: '15 * * * *'    # 予約が遅れて飛ばされた時の保険（予定時刻を過ぎた未投稿だけ出す）
  workflow_dispatch: {}     # 手動実行ボタン（テスト用）
permissions:
  contents: write
concurrency: threads-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 投稿
        working-directory: threads
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/threads/
        run: |
          if [ -z "$THREADS_TOKEN" ]; then echo "THREADS_TOKEN が未設定です（Settings → Secrets → Actions）"; exit 1; fi
          python post_threads.py
      - name: 投稿済みを記録
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add -A threads/queue.csv threads/stats.csv threads/stats_latest.md 2>/dev/null || git add threads/queue.csv
          git diff --cached --quiet || (git commit -m "Threads: 投稿済みと数字を記録" && for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 5; done)
