name: Instagram リール投稿
on:
  schedule:
    - cron: '30 22 * * *'   # 日本時間 7:30（この回で数字も記録）
    - cron: '30 6 * * *'    # 日本時間 15:30（バズった第2話の時間帯）
    - cron: '30 11 * * *'   # 日本時間 20:30
    - cron: '40 * * * *'    # 予約が遅れて飛ばされた時の保険（予定時刻を過ぎた未投稿だけ出す）
  workflow_dispatch:
    inputs:
      code:
        description: '初回だけ：ログイン後のGitHubのアドレス（code=…）を貼る'
        required: false
        default: ''
      fbcode:
        description: '流行り曲用：Facebookで許可した後のGitHubのアドレス（code=…）を貼る'
        required: false
        default: ''
      check:
        description: '公開せずに動画のアップロードだけ確かめる'
        type: boolean
        default: false
permissions:
  contents: write
concurrency: instagram-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: トークン準備
        working-directory: instagram
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          CODE: ${{ inputs.code }}
        run: |
          if [ -z "$IG_APP_SECRET" ]; then echo "IG_APP_SECRET が未設定です（Settings → Secrets → Actions）"; exit 1; fi
          if [ -n "$CODE" ]; then python ig_token.py exchange "$CODE"; else python ig_token.py refresh; fi
      - name: 流行り曲用のトークン（Facebookログイン）
        if: inputs.fbcode != ''
        working-directory: instagram
        env:
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          FBCODE: ${{ inputs.fbcode }}
        run: |
          if [ -z "$FB_APP_SECRET" ]; then echo "FB_APP_SECRET が未設定です（Settings → Secrets → Actions）"; exit 1; fi
          python fb_token.py exchange "$FBCODE"
      - name: 投稿
        working-directory: instagram
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          VIDEO_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/instagram/
          CHECK: ${{ inputs.check }}
        run: |
          if [ "$CHECK" = "true" ]; then python post_reels.py --check; else python post_reels.py; fi
      - name: 数字を記録（再生・保存・シェアなど）
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 22 * * *')
        continue-on-error: true
        working-directory: instagram
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: python stats.py
      - name: 投稿済みとトークンを記録
        if: always()
        run: |
          git config user.name "instagram-bot"
          git config user.email "instagram-bot@users.noreply.github.com"
          git add -A instagram/
          git diff --cached --quiet || (git commit -m "Instagram: 投稿済み・トークンを記録" && for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 5; done)
