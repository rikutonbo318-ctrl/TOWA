name: Instagram リール投稿
on:
  schedule:
    - cron: '30 11 * * *'   # 日本時間 20:30
    - cron: '0 12 * * *'    # 予約が遅れて飛ばされた時の保険（日本時間 21:00）
    - cron: '45 12 * * *'   # 同上（日本時間 21:45）
  workflow_dispatch:
    inputs:
      code:
        description: '初回だけ：ログイン後のGitHubのアドレス（code=…）を貼る'
        required: false
        default: ''
      check:
        description: '公開せずに動画のアップロードだけ確かめる'
        type: boolean
        default: false
permissions:
  contents: write
concurrency: instagram-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: トークン準備
        working-directory: instagram
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          CODE: ${{ inputs.code }}
        run: |
          if [ -z "$IG_APP_SECRET" ]; then echo "IG_APP_SECRET が未設定です（Settings → Secrets → Actions）"; exit 1; fi
          if [ -n "$CODE" ]; then python ig_token.py exchange "$CODE"; else python ig_token.py refresh; fi
      - name: 投稿
        working-directory: instagram
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          VIDEO_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/instagram/
          CHECK: ${{ inputs.check }}
        run: |
          if [ "$CHECK" = "true" ]; then python post_reels.py --check; else python post_reels.py; fi
      - name: 数字を記録（再生・保存・シェアなど）
        if: always()
        continue-on-error: true
        working-directory: instagram
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: python stats.py
      - name: 投稿済みとトークンを記録
        if: always()
        run: |
          git config user.name "instagram-bot"
          git config user.email "instagram-bot@users.noreply.github.com"
          git add -A instagram/
          git diff --cached --quiet || (git commit -m "Instagram: 投稿済み・トークンを記録" && git push)
